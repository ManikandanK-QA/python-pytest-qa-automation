name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly regression: catches drift in the third-party demo targets.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy

  ui:
    name: UI / ${{ matrix.browser }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - run: python -m pip install -e .

      - name: Install ${{ matrix.browser }}
        run: python -m playwright install --with-deps ${{ matrix.browser }}

      - name: Run UI suite on ${{ matrix.browser }}
        run: >
          python -m pytest -m ui
          --browser=${{ matrix.browser }}
          -n auto
          --junitxml=reports/junit-${{ matrix.browser }}.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-ui-${{ matrix.browser }}
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-ui-${{ matrix.browser }}
          path: reports/junit-*.xml
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-ui-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: warn

  api:
    name: API
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # No browser install: REST tests never launch one.
      - run: python -m pip install -e .

      - run: python -m pytest -m api -n auto --junitxml=reports/junit-api.xml

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-api
          path: allure-results/
          retention-days: 7
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: junit-api
          path: reports/junit-api.xml
          retention-days: 7
          if-no-files-found: warn

  publish:
    name: Publish Allure report
    needs: [quality, ui, api]
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: npm install -g allure-commandline --silent

      - uses: actions/download-artifact@v8
        with:
          pattern: allure-*
          merge-multiple: true
          path: allure-results

      - name: Generate combined report
        run: allure generate allure-results --clean -o allure-report

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
